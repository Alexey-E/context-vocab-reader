saveExact: true
frozenLockfile: true

overrides:
  "brace-expansion@1.1.16": 1.1.18
  "brace-expansion@5.0.7": 5.0.9
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.0

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

trustPolicy: no-downgrade
trustLockfile: false
trustPolicyExclude:
  # Existing transitive versions that predate this policy. Review on parent updates.
  - "eslint-import-resolver-typescript@3.10.1"
  - "semver@6.3.1"
  - "undici-types@6.21.0"

blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false
